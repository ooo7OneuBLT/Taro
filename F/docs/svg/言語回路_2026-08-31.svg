<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" font-family="Yu Gothic, Meiryo, sans-serif">
  <rect width="1200" height="1560" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="24" fill="#222" font-weight="bold">太郎の言語回路（2026-08-31 時点）</text>

  <!-- 凡例 -->
  <g font-size="13" fill="#333">
    <rect x="60" y="70" width="18" height="18" fill="#dbe9f8" stroke="#4a7ab5"/>
    <text x="86" y="84">神経回路（経験で重みが変わる）</text>
    <rect x="330" y="70" width="18" height="18" fill="#fdeacc" stroke="#c98a2b"/>
    <text x="356" y="84">表引き（記録と平均。忘れない）</text>
    <rect x="600" y="70" width="18" height="18" fill="#e8e8e8" stroke="#999"/>
    <text x="626" y="84">借り物（凍結・育たない）</text>
    <rect x="830" y="70" width="18" height="18" fill="#ffffff" stroke="#888"/>
    <text x="856" y="84">器官・ルール</text>
    <text x="1020" y="84" fill="#b3541e">★＝今週できた部分</text>
  </g>

  <!-- ===== 世界 ===== -->
  <rect x="150" y="120" width="900" height="70" rx="10" fill="#e7f3e7" stroke="#5a9a5a"/>
  <text x="600" y="147" text-anchor="middle" font-size="16" fill="#2c5e2c" font-weight="bold">世界</text>
  <text x="330" y="172" text-anchor="middle" font-size="14" fill="#2c5e2c">親の声「わんわんだね」</text>
  <text x="800" y="172" text-anchor="middle" font-size="14" fill="#2c5e2c">犬（いま見えている物）</text>

  <!-- 世界 → 耳・目 -->
  <line x1="330" y1="190" x2="330" y2="252" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="190" x2="800" y2="252" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== 耳・目 ===== -->
  <rect x="220" y="255" width="220" height="70" rx="8" fill="#ffffff" stroke="#888"/>
  <text x="330" y="283" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">耳</text>
  <text x="330" y="306" text-anchor="middle" font-size="12" fill="#555">音を1文字ずつトークンにする</text>

  <rect x="690" y="255" width="220" height="70" rx="8" fill="#e8e8e8" stroke="#999"/>
  <text x="800" y="283" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">目（DINOv2）</text>
  <text x="800" y="306" text-anchor="middle" font-size="12" fill="#555">見えを384個の数字に</text>

  <!-- 耳 → GRU / lexicon,  目 → lexicon -->
  <line x1="290" y1="325" x2="290" y2="425" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <text x="278" y="380" text-anchor="end" font-size="12" fill="#b3541e">★話者の印つき</text>
  <path d="M 440 310 C 560 330, 640 380, 688 425" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="360" font-size="12" fill="#555">聞いた語を登録</text>
  <line x1="800" y1="325" x2="800" y2="425" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <text x="812" y="380" font-size="12" fill="#555">照合</text>

  <!-- ===== GRU と lexicon ===== -->
  <rect x="150" y="430" width="300" height="120" rx="8" fill="#dbe9f8" stroke="#4a7ab5"/>
  <text x="300" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e79">大脳皮質（GRU）</text>
  <text x="300" y="482" text-anchor="middle" font-size="12" fill="#333">★文脈を覚えている（場面ごとにリセット）</text>
  <text x="300" y="502" text-anchor="middle" font-size="12" fill="#333">★次の音を予測し、聞くたび学習</text>
  <text x="300" y="522" text-anchor="middle" font-size="12" fill="#333">（LLMの事前学習と同じ形）</text>

  <rect x="640" y="430" width="320" height="120" rx="8" fill="#fdeacc" stroke="#c98a2b"/>
  <text x="800" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4d0e">側頭葉（lexicon）</text>
  <text x="800" y="482" text-anchor="middle" font-size="12" fill="#333">語 ⇄ 見えの平均 の対応表</text>
  <text x="800" y="502" text-anchor="middle" font-size="12" fill="#333">聞く・話すの両方向で使う交差点</text>
  <text x="800" y="522" text-anchor="middle" font-size="12" fill="#333">10語＋切り出した単位が並ぶ</text>

  <!-- GRU → lexicon 分節 -->
  <path d="M 450 470 L 638 470" fill="none" stroke="#b3541e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="545" y="460" text-anchor="middle" font-size="12" fill="#b3541e">★予測の谷＝語の切れ目</text>

  <!-- GRU/lexicon → 語の選択 -->
  <path d="M 300 550 C 320 610, 420 640, 480 655" fill="none" stroke="#4a7ab5" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="632" font-size="12" fill="#4a7ab5">★λ×予測（言いやすさ）</text>
  <path d="M 800 550 C 780 610, 700 640, 660 655" fill="none" stroke="#c98a2b" stroke-width="2" marker-end="url(#a)"/>
  <text x="755" y="632" font-size="12" fill="#a06a15">コサイン（似ている度）</text>

  <!-- ===== 語の選択 ===== -->
  <rect x="420" y="660" width="330" height="78" rx="8" fill="#ffffff" stroke="#888"/>
  <text x="585" y="688" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">語の選択</text>
  <text x="585" y="714" text-anchor="middle" font-size="13" fill="#333">点数 ＝ コサイン ＋ λ×予測 → 1位の語</text>

  <line x1="585" y1="738" x2="585" y2="800" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== 門 ===== -->
  <rect x="420" y="805" width="330" height="92" rx="8" fill="#dbe9f8" stroke="#4a7ab5"/>
  <text x="585" y="833" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e79">★大脳基底核の門（動機）</text>
  <text x="585" y="857" text-anchor="middle" font-size="12" fill="#333">言う価値 と 黙る価値 をくらべて</text>
  <text x="585" y="877" text-anchor="middle" font-size="12" fill="#333">確率πで「言う／黙る」を決める</text>

  <rect x="880" y="805" width="220" height="92" rx="8" fill="#dbe9f8" stroke="#4a7ab5"/>
  <text x="990" y="833" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4e79">★ドーパミン</text>
  <text x="990" y="857" text-anchor="middle" font-size="12" fill="#333">声のコストを引いた実入りで</text>
  <text x="990" y="877" text-anchor="middle" font-size="12" fill="#333">言う価値・黙る価値を更新</text>
  <line x1="878" y1="851" x2="752" y2="851" stroke="#4a7ab5" stroke-width="2" marker-end="url(#a)"/>

  <line x1="585" y1="897" x2="585" y2="958" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <text x="597" y="935" font-size="12" fill="#555">「言う」なら</text>

  <!-- ===== 計画と帳面 ===== -->
  <rect x="240" y="962" width="300" height="78" rx="8" fill="#ffffff" stroke="#888"/>
  <text x="390" y="990" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">ブローカ野（計画）</text>
  <text x="390" y="1015" text-anchor="middle" font-size="12" fill="#333">語をモーラ（かな1文字）に分ける</text>

  <rect x="660" y="962" width="300" height="78" rx="8" fill="#fdeacc" stroke="#c98a2b"/>
  <text x="810" y="990" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4d0e">小脳の帳面</text>
  <text x="810" y="1015" text-anchor="middle" font-size="12" fill="#333">音 → 口の動き（喃語期に書いた表）</text>

  <line x1="540" y1="1001" x2="658" y2="1001" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <text x="599" y="992" text-anchor="middle" font-size="12" fill="#555">1音ずつ引く</text>

  <path d="M 810 1040 C 780 1080, 700 1100, 650 1108" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== 声道 ===== -->
  <rect x="420" y="1100" width="330" height="70" rx="8" fill="#ffffff" stroke="#888"/>
  <text x="585" y="1128" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">声道（口）</text>
  <text x="585" y="1152" text-anchor="middle" font-size="12" fill="#333">口の4つの数字 → ひらがな1文字（出せない音はここで化ける）</text>

  <line x1="585" y1="1170" x2="585" y2="1230" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== 声 ===== -->
  <rect x="470" y="1235" width="230" height="56" rx="28" fill="#e7f3e7" stroke="#5a9a5a"/>
  <text x="585" y="1270" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5e2c">声「わんわん」</text>

  <!-- ループ左：自分の声 → 文脈へ -->
  <path d="M 468 1263 C 90 1240, 70 800, 148 500" fill="none" stroke="#4a7ab5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#c)"/>
  <text x="96" y="900" font-size="12" fill="#4a7ab5" transform="rotate(-90 96 900)">★自分の声も文脈へ（話者の印＝自分）</text>

  <!-- ループ右：声 → 親が返事 → 報酬 -->
  <path d="M 702 1263 C 1120 1240, 1130 1050, 1035 899" fill="none" stroke="#5a9a5a" stroke-width="2" marker-end="url(#d)"/>
  <text x="1112" y="1105" font-size="12" fill="#2c5e2c" transform="rotate(-90 1112 1105)">★親が0.1〜1.4秒後に返事 → 報酬</text>

  <!-- 矢じり定義 -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#666"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#b3541e"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#4a7ab5"/>
    </marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#5a9a5a"/>
    </marker>
  </defs>

  <!-- 下部の注釈 -->
  <g font-size="13" fill="#555">
    <text x="600" y="1350" text-anchor="middle">聞くだけでも回路は動く：耳 → GRU（聞くたび学習）＋ lexicon（語の登録）。話すのは門が開いたときだけ。</text>
    <text x="600" y="1378" text-anchor="middle">2つのループが世界を回る：自分の声は文脈に戻り（左）、親の返事は動機を育てる（右）。</text>
    <text x="600" y="1406" text-anchor="middle" fill="#888">未実装：内語の監視（言う直前の点検）／「いつ言うか」の学習／2語目の計画（分節の次の段）</text>
  </g>
</svg>
